<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="USA Car Plates">
  <!-- Proposal logo: a license plate with the game name. Replace this file to change it. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde4ee"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1b2540" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Plate -->
  <g filter="url(#shadow)">
    <rect x="40" y="70" width="560" height="260" rx="34" fill="url(#plate)" stroke="#1b2540" stroke-width="10"/>
  </g>
  <rect x="58" y="88" width="524" height="224" rx="22" fill="none" stroke="#ffffff" stroke-width="6"/>
  <!-- Bolt holes -->
  <circle cx="110" cy="118" r="9" fill="#9aa4bb"/>
  <circle cx="530" cy="118" r="9" fill="#9aa4bb"/>
  <circle cx="110" cy="282" r="9" fill="#9aa4bb"/>
  <circle cx="530" cy="282" r="9" fill="#9aa4bb"/>

  <!-- Stars line -->
  <text x="320" y="130" text-anchor="middle" fill="#ff7a2f"
        font-family="Trebuchet MS, Segoe UI, -apple-system, sans-serif" font-size="26" font-weight="800"
        letter-spacing="14">★ ★ ★ ★ ★</text>

  <!-- Name -->
  <text x="320" y="228" text-anchor="middle" fill="#1b2540"
        font-family="Trebuchet MS, Segoe UI, -apple-system, sans-serif" font-size="84" font-weight="800"
        letter-spacing="-1">CarPlates</text>

  <!-- Bottom line -->
  <text x="320" y="286" text-anchor="middle" fill="#3557e8"
        font-family="Courier New, monospace" font-size="30" font-weight="700"
        letter-spacing="10">SPOT·IT</text>

  <!-- Tilted USA badge, like the header's -->
  <g transform="translate(320 52) rotate(-4)">
    <rect x="-108" y="-40" width="216" height="80" rx="16" fill="#2541b8" transform="translate(0 8)"/>
    <rect x="-108" y="-40" width="216" height="80" rx="16" fill="#3557e8"/>
    <text x="0" y="20" text-anchor="middle" fill="#ffffff"
          font-family="Trebuchet MS, Segoe UI, -apple-system, sans-serif" font-size="56" font-weight="800"
          letter-spacing="10">USA</text>
  </g>
</svg>
